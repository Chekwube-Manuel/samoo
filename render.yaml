# render.yaml - Deploy everything to Render in one click
# Prerequisites:
#   1. Supabase project created, get the connection string (Transaction mode, port 6543)
#   2. Fill in all env var values marked with "REPLACE_ME" before deploying
#
# Deploy: Connect this repo in the Render dashboard → "New Blueprint"
# Render will create all 3 services (Redis + backend + worker + frontend) automatically.
#
# NOTE: Supabase is your database — Render does NOT create a Postgres instance here.
# Set DATABASE_URL and FRONTEND_DATABASE_URL from your Supabase project dashboard.

services:
  # ─────────────────────────────────────────────
  # Redis  (Render managed)
  # ─────────────────────────────────────────────
  - type: redis
    name: supoclip-redis
    plan: starter
    maxmemoryPolicy: noeviction
    ipAllowList: []   # only allow internal access

  # ─────────────────────────────────────────────
  # Backend  (FastAPI)
  # ─────────────────────────────────────────────
  - type: web
    name: supoclip-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: standard           # needs CPU for ffmpeg; upgrade to pro for whisper
    disk:
      name: supoclip-media
      mountPath: /app/uploads
      sizeGB: 20             # increase if you process many large videos
    envVars:
      # ── Database (Supabase) ──────────────────
      # Use the "Transaction mode" pooler URL from Supabase: Settings → Database → Connection string
      # Format: postgresql+asyncpg://postgres.[ref]:[password]@aws-0-[region].pooler.supabase.com:6543/postgres
      - key: DATABASE_URL
        value: REPLACE_ME_postgresql+asyncpg://postgres.xxxx:password@aws-0-region.pooler.supabase.com:6543/postgres

      # ── Redis (auto-wired from the service above) ──
      - key: REDIS_URL
        fromService:
          type: redis
          name: supoclip-redis
          property: connectionString
      # arq uses host/port/password separately — these extract them from the URL
      - key: REDIS_HOST
        fromService:
          type: redis
          name: supoclip-redis
          property: host
      - key: REDIS_PORT
        fromService:
          type: redis
          name: supoclip-redis
          property: port
      - key: REDIS_PASSWORD
        fromService:
          type: redis
          name: supoclip-redis
          property: password

      # ── AI / Transcription ──────────────────
      - key: TRANSCRIPTION_PROVIDER
        value: assemblyai             # or: whisper (free, no key needed, needs bigger plan)
      - key: ASSEMBLY_AI_API_KEY
        value: REPLACE_ME
      - key: LLM
        value: google-gla:gemini-3-flash-preview   # or openai:gpt-4o, anthropic:claude-3-5-sonnet
      - key: GOOGLE_API_KEY
        value: REPLACE_ME             # match whichever LLM you chose above
      # - key: OPENAI_API_KEY
      #   value: REPLACE_ME
      # - key: ANTHROPIC_API_KEY
      #   value: REPLACE_ME
      # - key: WHISPER_MODEL_SIZE
      #   value: medium               # only needed when TRANSCRIPTION_PROVIDER=whisper

      # ── Auth secrets (generate with: openssl rand -hex 32) ──
      - key: BETTER_AUTH_SECRET
        value: REPLACE_ME
      - key: BACKEND_AUTH_SECRET
        value: REPLACE_ME
      - key: APP_SETTINGS_ENCRYPTION_KEY
        value: REPLACE_ME

      # ── App URLs ────────────────────────────
      # Set to your actual Render frontend URL after first deploy, e.g.:
      # https://supoclip-frontend.onrender.com
      - key: NEXT_PUBLIC_APP_URL
        value: REPLACE_ME_https://supoclip-frontend.onrender.com
      - key: CORS_ORIGINS
        value: REPLACE_ME_https://supoclip-frontend.onrender.com

      # ── Self-host mode (no billing) ─────────
      - key: SELF_HOST
        value: "true"
      - key: ALLOW_UNSIGNED_BACKEND_AUTH
        value: "false"

      # ── Optional ────────────────────────────
      # - key: PEXELS_API_KEY
      #   value: REPLACE_ME           # for AI B-Roll
      # - key: DISCORD_FEEDBACK_WEBHOOK_URL
      #   value: REPLACE_ME
      # - key: AWS_REGION
      #   value: us-east-1
      # - key: AWS_ACCESS_KEY_ID
      #   value: REPLACE_ME
      # - key: AWS_SECRET_ACCESS_KEY
      #   value: REPLACE_ME
      # - key: SES_FROM_EMAIL
      #   value: "SupoClip <onboarding@yourdomain.com>"

  # ─────────────────────────────────────────────
  # Worker  (arq background job processor)
  # Same Docker image as backend, different start command
  # ─────────────────────────────────────────────
  - type: worker
    name: supoclip-worker
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    startCommand: .venv/bin/arq src.workers.tasks.WorkerSettings
    plan: standard           # needs CPU/RAM for video processing
    disk:
      name: supoclip-media   # SAME disk name as backend → shared persistent storage
      mountPath: /app/uploads
      sizeGB: 20
    envVars:
      - key: DATABASE_URL
        value: REPLACE_ME_postgresql+asyncpg://postgres.xxxx:password@aws-0-region.pooler.supabase.com:6543/postgres
      - key: REDIS_HOST
        fromService:
          type: redis
          name: supoclip-redis
          property: host
      - key: REDIS_PORT
        fromService:
          type: redis
          name: supoclip-redis
          property: port
      - key: REDIS_PASSWORD
        fromService:
          type: redis
          name: supoclip-redis
          property: password
      - key: TRANSCRIPTION_PROVIDER
        value: assemblyai
      - key: ASSEMBLY_AI_API_KEY
        value: REPLACE_ME
      - key: LLM
        value: google-gla:gemini-3-flash-preview
      - key: GOOGLE_API_KEY
        value: REPLACE_ME
      - key: BETTER_AUTH_SECRET
        value: REPLACE_ME
      - key: BACKEND_AUTH_SECRET
        value: REPLACE_ME
      - key: APP_SETTINGS_ENCRYPTION_KEY
        value: REPLACE_ME
      - key: NEXT_PUBLIC_APP_URL
        value: REPLACE_ME_https://supoclip-frontend.onrender.com
      - key: SELF_HOST
        value: "true"
      - key: ALLOW_UNSIGNED_BACKEND_AUTH
        value: "false"
      # - key: WHISPER_MODEL_SIZE
      #   value: medium

  # ─────────────────────────────────────────────
  # Frontend  (Next.js)
  # ─────────────────────────────────────────────
  - type: web
    name: supoclip-frontend
    runtime: docker
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: ./frontend
    plan: starter
    buildCommand: ""   # Dockerfile handles the build
    envVars:
      # ── Database (Supabase — Prisma uses standard postgresql://) ──
      # Use the "Session mode" or "Direct connection" URL from Supabase (port 5432)
      # Format: postgresql://postgres.[ref]:[password]@aws-0-[region].pooler.supabase.com:5432/postgres
      - key: DATABASE_URL
        value: REPLACE_ME_postgresql://postgres.xxxx:password@aws-0-region.pooler.supabase.com:5432/postgres

      # ── Backend internal URL (container-to-container) ──
      # On Render, services talk to each other via their render.com URL
      # Set this to the backend's onrender.com URL
      - key: BACKEND_INTERNAL_URL
        value: REPLACE_ME_https://supoclip-backend.onrender.com
      - key: NEXT_PUBLIC_API_URL
        value: REPLACE_ME_https://supoclip-backend.onrender.com

      # ── Auth ──────────────────────────────────
      - key: BETTER_AUTH_SECRET
        value: REPLACE_ME          # same value as backend
      - key: BETTER_AUTH_URL
        value: REPLACE_ME_https://supoclip-frontend.onrender.com
      - key: BACKEND_AUTH_SECRET
        value: REPLACE_ME          # same value as backend
      - key: APP_SETTINGS_ENCRYPTION_KEY
        value: REPLACE_ME          # same value as backend

      # ── App URL ─────────────────────────────
      - key: NEXT_PUBLIC_APP_URL
        value: REPLACE_ME_https://supoclip-frontend.onrender.com

      # ── Self-host (no billing) ──────────────
      - key: SELF_HOST
        value: "true"
      - key: NEXT_PUBLIC_SELF_HOST
        value: "true"
      - key: NODE_ENV
        value: production

      # ── Optional ────────────────────────────
      # - key: DISABLE_SIGN_UP
      #   value: "false"
      # - key: AWS_REGION
      #   value: us-east-1
      # - key: AWS_ACCESS_KEY_ID
      #   value: REPLACE_ME
      # - key: AWS_SECRET_ACCESS_KEY
      #   value: REPLACE_ME
      # - key: SES_FROM_EMAIL
      #   value: "SupoClip <onboarding@yourdomain.com>"
