# render.yaml — Deploy SupoClip to Render in one click
#
# HOW TO DEPLOY:
#   1. Push this repo to GitHub (already done)
#   2. Render dashboard → New → Blueprint → connect your GitHub repo
#   3. Click Deploy — all services are pre-configured below
#
# AFTER FIRST DEPLOY — make yourself admin in Supabase SQL editor:
#   UPDATE users SET is_admin = true WHERE email = 'your@email.com';
#
# Then run Prisma migrations (from your local machine):
#   DATABASE_URL="postgresql://postgres:samoomediaai@db.ipnpbpomyuxoepvuymvk.supabase.co:5432/postgres" \
#   npx prisma migrate deploy --schema=frontend/prisma/schema.prisma
#
# COST: ~$35/mo (Redis $3 + Backend $25 + Frontend $7) + Supabase free tier

services:

  # ── Redis ────────────────────────────────────────────────────────────────────
  - type: redis
    name: supoclip-redis
    plan: starter
    maxmemoryPolicy: noeviction
    ipAllowList: []

  # ── Backend + Worker (combined — shares disk for uploads/clips) ───────────────
  - type: web
    name: supoclip-backend
    runtime: docker
    # dockerfilePath is relative to repo root; dockerContext is the build context
    # Render resolves dockerfilePath from root, COPY instructions use dockerContext as base
    rootDir: ./backend
    dockerfilePath: ./Dockerfile
    startCommand: sh bin/start-combined.sh
    plan: standard
    disk:
      name: supoclip-media
      mountPath: /app/uploads
      sizeGB: 20
    healthCheckPath: /health/db
    envVars:
      # ── Database (Supabase — asyncpg driver for SQLAlchemy) ─────────────────
      - key: DATABASE_URL
        value: postgresql+asyncpg://postgres:samoomediaai@db.ipnpbpomyuxoepvuymvk.supabase.co:5432/postgres

      # ── Redis ───────────────────────────────────────────────────────────────
      - key: REDIS_HOST
        fromService:
          type: redis
          name: supoclip-redis
          property: host
      - key: REDIS_PORT
        fromService:
          type: redis
          name: supoclip-redis
          property: port
      - key: REDIS_PASSWORD
        fromService:
          type: redis
          name: supoclip-redis
          property: password

      # ── Transcription ───────────────────────────────────────────────────────
      - key: TRANSCRIPTION_PROVIDER
        value: assemblyai
      - key: ASSEMBLY_AI_API_KEY
        value: 81e7274dd9fe4a47a8b18f09d5f921ee
      - key: WHISPER_MODEL_SIZE
        value: medium

      # ── LLM — OpenAI ─────────────────────────────────────────────────────────
      # Enter your OpenAI key in the Render dashboard after deploying
      - key: LLM
        value: openai:gpt-4o
      - key: OPENAI_API_KEY
        sync: false

      # ── Secrets ─────────────────────────────────────────────────────────────
      - key: BETTER_AUTH_SECRET
        value: bb9dbb00d6f424e995b2d99b3135638214b8bb6aa128bbfcde6626e0837b8b58
      - key: BACKEND_AUTH_SECRET
        value: 77ca81cfb9be834fdf32c4df43919f4e3f1d0e8f1d9ec879c6cad86077e90db7
      - key: APP_SETTINGS_ENCRYPTION_KEY
        value: c0cb0e997671c75f0ef550b0613f567799bd83f091fa139a22f273c4d4c02090

      # ── URLs ─────────────────────────────────────────────────────────────────
      - key: NEXT_PUBLIC_APP_URL
        value: https://supoclip-frontend.onrender.com
      - key: CORS_ORIGINS
        value: https://supoclip-frontend.onrender.com

      # ── Config ───────────────────────────────────────────────────────────────
      - key: SELF_HOST
        value: "true"
      - key: ALLOW_UNSIGNED_BACKEND_AUTH
        value: "false"
      - key: AUTH_SIGNATURE_TTL_SECONDS
        value: "300"
      - key: OUTPUT_DIR
        value: /app/uploads/outputs
      - key: DEFAULT_PROCESSING_MODE
        value: fast
      - key: FAST_MODE_MAX_CLIPS
        value: "4"
      - key: FAST_MODE_TRANSCRIPT_MODEL
        value: universal

  # ── Frontend (Next.js) ───────────────────────────────────────────────────────
  - type: web
    name: supoclip-frontend
    runtime: docker
    rootDir: ./frontend
    dockerfilePath: ./Dockerfile
    plan: starter
    # NEXT_PUBLIC_* must be baked in at Docker build time
    dockerBuildArgs:
      NEXT_PUBLIC_API_URL: https://supoclip-backend.onrender.com
      NEXT_PUBLIC_APP_URL: https://supoclip-frontend.onrender.com
      NEXT_PUBLIC_SELF_HOST: "true"
      NEXT_PUBLIC_PRO_PRICE_MONTHLY: "10"
      NEXT_PUBLIC_SCALE_PRICE_MONTHLY: "50"
      NEXT_PUBLIC_FREE_PLAN_TASK_LIMIT: "10"
      NEXT_PUBLIC_PRO_PLAN_TASK_LIMIT: "50"
      NEXT_PUBLIC_SCALE_PLAN_TASK_LIMIT: "300"
    healthCheckPath: /api/auth/get-session
    envVars:
      # ── Database (Supabase — standard postgresql:// for Prisma) ────────────
      - key: DATABASE_URL
        value: postgresql://postgres:samoomediaai@db.ipnpbpomyuxoepvuymvk.supabase.co:5432/postgres

      # ── Backend ──────────────────────────────────────────────────────────────
      - key: BACKEND_INTERNAL_URL
        value: https://supoclip-backend.onrender.com
      - key: NEXT_PUBLIC_API_URL
        value: https://supoclip-backend.onrender.com

      # ── Auth ─────────────────────────────────────────────────────────────────
      - key: BETTER_AUTH_SECRET
        value: bb9dbb00d6f424e995b2d99b3135638214b8bb6aa128bbfcde6626e0837b8b58
      - key: BETTER_AUTH_URL
        value: https://supoclip-frontend.onrender.com
      - key: BACKEND_AUTH_SECRET
        value: 77ca81cfb9be834fdf32c4df43919f4e3f1d0e8f1d9ec879c6cad86077e90db7
      - key: APP_SETTINGS_ENCRYPTION_KEY
        value: c0cb0e997671c75f0ef550b0613f567799bd83f091fa139a22f273c4d4c02090

      # ── App ──────────────────────────────────────────────────────────────────
      - key: NEXT_PUBLIC_APP_URL
        value: https://supoclip-frontend.onrender.com
      - key: SELF_HOST
        value: "true"
      - key: NEXT_PUBLIC_SELF_HOST
        value: "true"
      - key: NODE_ENV
        value: production
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
